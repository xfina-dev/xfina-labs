name: Request a feature
description: An idea for a Labs tool, or a new one.
title: "[Idea] "
labels: [enhancement]
body:
  - type: input
    id: tool
    attributes:
      label: Tool
      placeholder: Portfolio Engine, or a new tool
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like?
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: What would it help you do?
      description: The question you're trying to answer helps more than the exact feature.
