name: Report a problem
description: Something in a Labs tool didn't work, or a figure looks wrong.
title: "[Problem] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time. Issues here are public: please leave out your own files, account details and amounts.
  - type: input
    id: tool
    attributes:
      label: Tool
      placeholder: Portfolio Engine
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you saw, and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How to see it
      description: The steps that lead to it, if you know them. A screenshot helps.
  - type: textarea
    id: environment
    attributes:
      label: Page and browser
      description: Filled in for you when you come from Labs.
      render: text
