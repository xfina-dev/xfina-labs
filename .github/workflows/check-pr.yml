name: Check PR

on:
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    # Required status check on main (branch protection). Keep the name in sync with it.
    name: Web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Check the Worker config
        run: npx wrangler deploy --dry-run
